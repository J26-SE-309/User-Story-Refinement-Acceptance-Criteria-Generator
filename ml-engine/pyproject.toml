[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "story-ml"
version = "0.1.0"
description = "User Story Refinement and Acceptance Criteria Generator: datasets, model training and evaluation"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
training = [
  "torch>=2.2",
  "transformers>=4.45",
  "datasets>=2.20",
  "peft>=0.12",
  "accelerate>=0.34",
]

[tool.hatch.build.targets.wheel]
packages = ["src/story_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
